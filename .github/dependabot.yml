# Weekly dependency updates (SR-021). Parser-exposed packages (Pillow, pillow-heif, OpenCV,
# python-multipart, @fastify/multipart) matter most: merge their security updates quickly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /apps/worker
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/worker]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
