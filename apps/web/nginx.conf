# Fineline web server: serves the SPA and proxies /api to the API (same origin).
# Installed as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged (inside the http block,
# runs as a non-root user on port 8080, temp files and pid under /tmp so the container can be read-only).
# Requirements: SR-001 (body limits), SR-017 (client address), SR-019 (headers), docs/ux (SPA routes).

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    charset utf-8;

    # SR-019: on every response, also errors and proxied API answers. No add_header in any location
    # below, so these are always inherited.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Default request body limit; the photo routes below raise it (SR-001).
    client_max_body_size 1m;

    # ---------- API (same origin, SR-017) ----------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the API trusts exactly this one hop for rate limits (SR-017).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Above the API's 30 s worker timeout, so the API (not nginx) answers slow conversions.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # nginx sets nosniff itself; avoid a duplicate header. The API's own CSP on file routes is kept.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Powered-By;

    # Customer photo upload: 15 MB photo plus multipart overhead.
    location = /api/v1/drawings {
        client_max_body_size 16m;
        error_page 413 = @photo_too_large;
        proxy_pass http://api:3000;
    }

    # Admin frame photos: 5 MB photo plus fields and overhead (create and replace).
    location = /api/v1/admin/frames {
        client_max_body_size 6m;
        error_page 413 = @frame_photo_too_large;
        proxy_pass http://api:3000;
    }

    location ~ ^/api/v1/admin/frames/[^/]+/photo$ {
        client_max_body_size 6m;
        error_page 413 = @frame_photo_too_large;
        proxy_pass http://api:3000;
    }

    location /api/ {
        error_page 413 = @payload_too_large;
        proxy_pass http://api:3000;
    }

    # nginx's own 413 in the API's error shape, as JSON (the web app also maps any 413 itself).
    location @photo_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"photo_too_large","message":"The photo must be at most 15 MB."}}';
    }

    location @frame_photo_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"photo_too_large","message":"The photo must be at most 5 MB."}}';
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"The request is too large."}}';
    }

    # ---------- SPA ----------
    # Hashed build assets never change: cache them long. A missing asset is a 404, not the app.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # The app shell must always be revalidated so a deploy is picked up at once.
    location = /index.html {
        expires epoch;
    }

    # History fallback: /, /admin/orders/<id> etc. all load the SPA, which routes in the browser.
    location / {
        try_files $uri /index.html;
    }
}
